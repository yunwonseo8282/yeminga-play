<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC코드 우정 케미 테스트 - 예밍아놀자</title>
  <meta name="description" content="30문항으로 알아보는 나의 우정 유형! 사회심리학 기반 32가지 유형 중 나는 어디에 속할까? 딱 3분이면 됩니다.">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5RL7MBR191"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5RL7MBR191');
  </script>
</head>
<body>
  <header class="play-header" id="playHeader">
    <div class="container">
      <a class="play-brand" href="/">
        <img class="brand-logo" src="/assets/logo.png" alt="예밍아놀자">
        <span>예밍아놀자</span>
      </a>
      <button class="play-login-btn" type="button" disabled>로그인</button>
    </div>
  </header>

  <main class="container-narrow">

    <!-- 인트로 화면 -->
    <section id="test-intro" class="section">
      <!-- JS(test-page.js)가 tests-data.js 데이터로 채움 -->
    </section>

    <!-- 질문 화면 -->
    <section id="test-questions" class="section" hidden>
      <div class="q-progress-area">
        <button type="button" id="back-btn" class="back-btn" aria-label="이전 질문으로">&#8592;</button>
        <div class="q-progress-inner">
          <p id="progress-text" class="q-progress-text"></p>
          <div class="q-progress-track">
            <div id="progress-fill" class="q-progress-fill"></div>
          </div>
        </div>
      </div>
      <p id="question-text" class="q-question-text"></p>
      <div id="choices" class="q-choices"></div>
    </section>

  </main>

  <!-- 광고 영역: 화면 전환 로직과 완전히 분리 -->
  <!-- AD:DISPLAY-TEST-01 -->
  <div id="ad-display-test-01" style="min-height:250px;"></div>

  <footer class="play-footer" id="playFooter"></footer>

  <script src="/js/tests-data.js" defer></script>
  <script src="/js/questions-friendship-code.js" defer></script>
  <script src="/js/types-friendship-code.js" defer></script>
  <script src="/js/scoring-friendship-code.js" defer></script>
  <script type="module" src="/js/test-page-friendship-code.js"></script>
  <script type="module" src="/js/firebase-init.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script src="/js/header.js" defer></script>
  <script src="/js/footer.js"></script>
</body>
</html>
