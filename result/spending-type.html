<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결과 - MBUY 소비 유형 테스트</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="play-header" id="playHeader">
    <div class="container">
      <a class="play-brand" href="/">
        <img class="brand-logo" src="/assets/logo.png" alt="예밍아놀자">
        <span>예밍아놀자</span>
      </a>
      <button class="play-login-btn" type="button" disabled>로그인</button>
    </div>
  </header>

  <main class="container-narrow section">
    <!-- 임시 확인용: 정식 결과 UI 는 Step 6~7 에서 구현 -->
    <h1 id="result-code"></h1>
    <p id="result-percent"></p>
  </main>

  <footer class="play-footer">
    <div class="container">
      <nav class="play-footer-nav">
        <a href="/privacy.html">개인정보처리방침</a>
      </nav>
      <p class="play-footer-copy">© 2026 예밍아놀자</p>
    </div>
  </footer>

  <script src="/js/header.js" defer></script>
  <script>
    (function () {
      var params  = new URLSearchParams(location.search);
      var code    = params.get('type');
      var percent = params.get('p');
      document.getElementById('result-code').textContent    = code    ? decodeURIComponent(code) : '(유형 없음)';
      document.getElementById('result-percent').textContent = percent ? percent + '%'             : '';
    })();
  </script>
</body>
</html>
