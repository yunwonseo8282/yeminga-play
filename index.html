<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예밍아놀자</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="play-header" id="playHeader">
    <div class="container">
      <a class="play-brand" href="/">
        <img class="brand-logo" src="/assets/logo.png" alt="예밍아놀자">
        <span>예밍아놀자</span>
      </a>
      <button class="play-login-btn" type="button" disabled>로그인</button>
    </div>
  </header>

  <section class="play-hero">
    <div class="container">
      <img class="play-hero-img"
           src="/images/hero-character.png"
           alt="예밍이 캐릭터"
           width="400" height="400"
           fetchpriority="high">
      <div class="play-hero-text">
        <p class="play-hero-eyebrow">어? 너 이거 해봤어?</p>
        <h1 class="play-hero-title">예밍이가 준비한 심리테스트, <span class="nowrap">골라서 해봐!</span></h1>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="play-grid" id="testGrid"></div>
    </div>
  </section>

  <footer class="play-footer">
    <div class="container">
      <nav class="play-footer-nav">
        <a href="/privacy.html">개인정보처리방침</a>
      </nav>
      <p class="play-footer-copy">© 2026 예밍아놀자</p>
    </div>
  </footer>

  <script src="/js/tests-data.js" defer></script>
  <script src="/js/participants.js" defer></script>
  <script src="/js/render-tests.js" defer></script>
  <script src="/js/header.js" defer></script>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" crossorigin="anonymous"></script>
  <script src="/js/kakao-init.js" defer></script>
  <script type="module" src="/js/firebase-init.js"></script>
</body>
</html>
